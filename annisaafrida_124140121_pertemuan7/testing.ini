###
# app configuration (pengujian: SQLite in-memory)
###

[app:main]
use = egg:library_api

pyramid.reload_templates = false
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en
pyramid.includes =
    pyramid_tm

sqlalchemy.url = sqlite:///:memory:

###
# logging configuration
###

[loggers]
keys = root, library_api, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_library_api]
level = DEBUG
handlers =
qualifiers =
qualname = library_api

[logger_sqlalchemy]
level = WARN
handlers =
qualifiers =
qualname = sqlalchemy

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
