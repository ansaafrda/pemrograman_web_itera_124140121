###
# app configuration
###

[app:main]
use = egg:library_api

pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en
pyramid.includes =
    pyramid_debugtoolbar
    pyramid_tm

sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/library_api_db

###
# wsgi server configuration
###

[server:main]
use = egg:waitress#main
listen = localhost:6544

###
# logging configuration
###

[loggers]
keys = root, library_api, sqlalchemy, waitress, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_library_api]
level = DEBUG
handlers =
qualifiers =
qualname = library_api

[logger_sqlalchemy]
level = INFO
handlers =
qualifiers =
qualname = sqlalchemy

[logger_waitress]
level = INFO
handlers =
qualifiers =
qualname = waitress

[logger_alembic]
level = INFO
handlers =
qualifiers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s

[alembic]
script_location = library_api/alembic
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/library_api_db
